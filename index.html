<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal NEXUS Alım Başvuru Formu</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .form-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }
        .form-header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
        }
        .form-header h2 {
            color: #58a6ff;
            font-size: 1.6rem;
            margin-bottom: 6px;
        }
        .form-header p {
            font-size: 0.9rem;
            color: #8b949e;
            margin: 0;
        }
        .section-title {
            color: #f0883e;
            font-size: 1.05rem;
            margin: 20px 0 12px 0;
            border-left: 3px solid #f0883e;
            padding-left: 8px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #e6edf3;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 0.9rem;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-header">
        <h2>ROYAL NEXUS ALIM FORMU</h2>
        <p>Aramıza katılmak için 20 soruluk başvuru formunu eksiksiz doldurun.</p>
    </div>

    <form action="https://formspree.io/f/mgbjqakz" method="POST">
        
        <div class="section-title">1. Kişisel Bilgiler & İletişim</div>
        <div class="form-group">
            <label for="ign">1. Oyun İçi Adınız (IGN) / Nickname</label>
            <input type="text" id="ign" name="1_Oyun_Ici_Ad" required placeholder="Örn: RNX_Player">
        </div>
        <div class="form-group">
            <label for="fullname">2. Adınız ve Soyadınız</label>
            <input type="text" id="fullname" name="2_Ad_Soyad" required placeholder="Ad Soyad">
        </div>
        <div class="form-group">
            <label for="age">3. Yaşınız</label>
            <input type="number" id="age" name="3_Yas" required placeholder="Örn: 18">
        </div>
        <div class="form-group">
            <label for="instagram">4. Instagram (IG) Hesabınız (Tek iletişim kanalı)</label>
            <input type="text" id="instagram" name="4_Instagram" required placeholder="@kullanici_adi">
        </div>
        <div class="form-group">
            <label for="ig_follow">5. Instagram Grubu ve Duyuruları Takip Edebilir misiniz?</label>
            <select id="ig_follow" name="5_Instagram_Takip" required>
                <option value="">Seçiniz...</option>
                <option value="Evet, düzenli takip ederim">Evet, düzenli takip ederim</option>
                <option value="Bazen bakabilirim">Bazen bakabilirim</option>
            </select>
        </div>

        <div class="section-title">2. Aktiflik & Donanım</div>
        <div class="form-group">
            <label for="active_hours">6. Günlük Oyunda Kalma / Aktiflik Süreniz (Saat)</label>
            <input type="text" id="active_hours" name="6_Aktiflik_Suresi" required placeholder="Örn: Günde 3-4 saat">
        </div>
        <div class="form-group">
            <label for="time_range">7. Hangi Saat Aralıklarında Oyundasınız?</label>
            <input type="text" id="time_range" name="7_Saat_Araliklari" required placeholder="Örn: 18:00 - 23:00">
        </div>
        <div class="form-group">
            <label for="device">8. Kullandığınız Cihaz Bilgisi (Cihaz Modeli / RAM vb.)</label>
            <input type="text" id="device" name="8_Cihaz_Bilgisi" required placeholder="Örn: iPhone 11 / Samsung A52">
        </div>
        <div class="form-group">
            <label for="ping">9. İnternet Bağlantınız ve Oyundaki Ping Durumunuz</label>
            <input type="text" id="ping" name="9_Internet_Ping" required placeholder="Örn: Akıcı, kasmıyor / Bazen yüksek ping">
        </div>
        <div class="form-group">
            <label for="skill">10. Oyun İçi El Beceriniz / Yetenek Seviyeniz</label>
            <select id="skill" name="10_Yetenek_Seviyesi" required>
                <option value="">Seçiniz...</option>
                <option value="Başlangıç Seviyesi">Başlangıç Seviyesi</option>
                <option value="Orta Seviye">Orta Seviye</option>
                <option value="İleri Seviye (Usta/Profesyonel)">İleri Seviye (Usta/Profesyonel)</option>
            </select>
        </div>

        <div class="section-title">3. Oyun İçi Tecrübe & Geçmiş</div>
        <div class="form-group">
            <label for="experience">11. Toplam Oyun Tecrübeniz (Ay / Yıl)</label>
            <input type="text" id="experience" name="11_Oyun_Tecrubesi" required placeholder="Örn: 2 Yıldır oynuyorum">
        </div>
        <div class="form-group">
            <label for="rank">12. Oyundaki Rütbeniz / Seviyeniz / Garaj Durumunuz</label>
            <input type="text" id="rank" name="12_Rutbe_Garaj" required placeholder="Mevcut seviye veya garaj durumu">
        </div>
        <div class="form-group">
            <label for="old_clans">13. Daha Önce Bulunduğunuz Klanlar / Ekipler</label>
            <textarea id="old_clans" name="13_Eski_Klanlar" rows="2" placeholder="Varsa klan isimlerini yazın..."></textarea>
        </div>
        <div class="form-group">
            <label for="leave_reason">14. Önceki Ekibinizden/Klanınızdan Ayrılma Sebebiniz</label>
            <textarea id="leave_reason" name="14_Ayrilma_Sebebi" rows="2" placeholder="Kısaca açıklayın..."></textarea>
        </div>
        <div class="form-group">
            <label for="role">15. Klan İçi İstenen Rol / Unvan</label>
            <input type="text" id="role" name="15_Istenen_Rol" required placeholder="Örn: Sürücü, Editör, Moderatör, Üye vb.">
        </div>

        <div class="section-title">4. Ekip Uyumu & Kurallar</div>
        <div class="form-group">
            <label for="why_rnx">16. Royal NEXUS Ekibine Katılmak İstemendeki Temel Sebep</label>
            <textarea id="why_rnx" name="16_RNX_Katilma_Sebebi" rows="2" required placeholder="Neden RNX?"></textarea>
        </div>
        <div class="form-group">
            <label for="contribution">17. Ekibimize / Klanımıza Nasıl Bir Katkı Sağlayabilirsin?</label>
            <textarea id="contribution" name="17_Saglanacak_Katki" rows="2" required placeholder="Açıklayınız..."></textarea>
        </div>
        <div class="form-group">
            <label for="teamwork">18. Ekip Ortamına Ve Arkadaşlara Ayak Uydurabilir misiniz?</label>
            <select id="teamwork" name="18_Ekip_Uyum" required>
                <option value="">Seçiniz...</option>
                <option value="Evet, kolayca uyum sağlarım">Evet, kolayca uyum sağlarım</option>
                <option value="Zamanla alışırım">Zamanla alışırım</option>
                <option value="Hayır">Hayır</option>
            </select>
        </div>
        <div class="form-group">
            <label for="events">19. Klan İçi Etkinlik ve Konvoylara Düzenli Katılır mısınız?</label>
            <select id="events" name="19_Etkinlik_Katilim" required>
                <option value="">Seçiniz...</option>
                <option value="Evet, hepsine katılırım">Evet, hepsine katılırım</option>
                <option value="Bazen katılamayabilirim">Bazen katılamayabilirim</option>
                <option value="Hayır">Hayır</option>
            </select>
        </div>
        <div class="form-group">
            <label for="rules">20. Royal NEXUS Kurallarına Ve Yönetim Kararlarına Uyar mısınız?</label>
            <select id="rules" name="20_Kural_Kabul" required>
                <option value="">Seçiniz...</option>
                <option value="Kabul Ediyorum">Kabul Ediyorum</option>
                <option value="Kabul Etmiyorum">Kabul Etmiyorum</option>
            </select>
        </div>

        <button type="submit">Başvuruyu Gönder</button>
    </form>
</div>

</body>
</html>
